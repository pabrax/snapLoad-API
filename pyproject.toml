[project]
name = "snapload-api"
version = "1.0.0"
description = "SnapLoad API - REST API for downloading media from YouTube and Spotify"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.1",
    "fastapi>=0.103.2",
    "httpx>=0.27,<0.28",
    "mutagen>=1.47.0",
    "python-dotenv>=1.2.1",
    "spotdl>=4.4.3",
    "uvicorn>=0.23.2",
    "yt-dlp[default]>=2026.8.19",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
